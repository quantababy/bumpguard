# bumpguard.toml — Configuration & Expiring Ignore Rules (Section 7.4)

[policy]
fail_on = "high" # low | medium | high | critical
max_findings_in_comment = 15

[ecosystems]
npm = true
pypi = true

[network]
registry_concurrency = 16
timeout_seconds = 20

# Sample documented binary download ignore with mandatory expiration date
[[ignore]]
package = "esbuild"
rule = "BG-EXEC-001"
reason = "documented binary download in postinstall"
expires = "2027-03-01" # ignores must expire so they get reviewed

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bumpguard"
version = "0.1.0"
description = "Dependency update risk scanner that inspects package updates for supply-chain risk and comments on pull requests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "security",
    "supply-chain",
    "dependency-scanner",
    "static-analysis",
    "ast",
    "pull-request",
    "npm",
    "pypi",
    "dsa-engine",
    "machine-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = []

[project.scripts]
bumpguard = "bumpguard.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["bumpguard*"]

[tool.setuptools.package-data]
"bumpguard" = ["model_weights.json"]

name: 'bumpguard'
description: 'Review dependency updates for supply-chain risk and comment on pull requests'
inputs:
  base:
    description: 'Base commit SHA or branch ref'
    required: true
  head:
    description: 'Head commit SHA or branch ref'
    required: true
  fail-on:
    description: 'Severity threshold to trigger exit failure (low, medium, high, critical)'
    default: 'high'
  format:
    description: 'Report output format (markdown or json)'
    default: 'markdown'
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        FAIL_ON: ${{ inputs.fail-on }}
        FORMAT: ${{ inputs.format }}
      run: |
        set -euo pipefail
        python -m bumpguard.cli diff --base "$BASE" --head "$HEAD" --fail-on "$FAIL_ON" --format "$FORMAT"
